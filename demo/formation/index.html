<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>öV NOWE • Formation</title>
</head>
<body>
    <!-- ═══════════════ HEADER ═══════════════ -->
    <header id="app-header">
        <div id="header-left">
            <button id="btn-home" onclick="window.location = '../'" title="Startseite">⌂ Home</button>
        </div>
        <div id="header-center">
            <span style="font-family: monospace">18:04:00</span>
        </div>
        <div id="header-right">
            <span id="app-title">öV NOWE</span>
        </div>
    </header>

    <!-- ═══════════════ EINGABE ═══════════════ -->
    <div id="input-section" style="padding: 14px; background: var(--header-bg); border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap;">
        <input id="evu" type="text" placeholder="fak. EVU (z.B. SBBP)" style="flex: 0 1 120px; background: white; border: 1px solid rgba(255,255,255,0.15); color: black; padding: 8px 12px; border-radius: 2px; font-family: inherit;">
        <input id="trainNumber" type="tel" placeholder="Zugnummer (z.B. 4713)" style="flex: 1; min-width: 100px; background: white; border: 1px solid rgba(255,255,255,0.15); color: black; padding: 8px 12px; border-radius: 2px; font-family: inherit;">
        <input id="date" type="date" style="flex: 0 1 150px; background: white; border: 1px solid rgba(255,255,255,0.15); color: black; padding: 8px 12px; border-radius: 2px; font-family: inherit;">
        <button onclick="fetchFormation()" style="flex: 1; background: var(--sbb-red); border: 1px solid var(--sbb-red); color: white; padding: 8px 20px; border-radius: 2px; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.15s;">GO</button>
    </div>

    <!-- ═══════════════ MAIN CONTENT ═══════════════ -->
    <div id="main-content" style="flex: 1; padding: 14px; overflow-y: auto; background: var(--board-bg);">
        <div id="result"></div>
    </div>

    <!-- ═══════════════ MODAL OVERLAY ═══════════════ -->
    <div id="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px;">
        <div id="modal-content" style="background: var(--board-row); border: 1px solid rgba(255,255,255,0.1); border-radius: 2px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative;">
            <button id="modal-close" onclick="closeModal()" style="position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px 8px; border-radius: 2px; cursor: pointer; font-size: 12px; transition: background 0.15s;">✕ Schliessen</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        document.getElementById('date').valueAsDate = new Date();

        function updateClock() {
            const el = document.getElementById('live-clock');
            if (!el) return;
            const now = new Date();
            el.textContent = now.getHours().toString().padStart(2,'0') + ':'
                           + now.getMinutes().toString().padStart(2,'0') + ':'
                           + now.getSeconds().toString().padStart(2,'0');
        }
        updateClock();
        setInterval(updateClock, 1000);

        document.getElementById('trainNumber').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchFormation();
        });

function closeModal() {
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.remove('active');
    overlay.style.display = 'none'; // Erzwingt das Schliessen trotz Inline-Styles
}

        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal-overlay')) {
                closeModal();
            }
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
